[http]
port = 8080

# H1.2: optional explicit local DB path in an existing private directory.
# [storage]
# sqlite_path = "/path/to/private/core.sqlite"

# H2.1: optional paired existing private roots (separate from DB).
# media_root = "/path/to/originals"
# workspace_root = "/path/to/attempts"

# H2.4: persistent private artifacts, separate from media/workspace/DB.
# artifact_root = "/path/to/persistent-artifacts"

# H2.5 optional OIDC; uncomment only on an authorized isolated HTTPS LAB.
# [oidc]
# issuer = "https://accounts.google.com"
# authorization_endpoint = "https://accounts.google.com/o/oauth2/v2/auth"
# token_endpoint = "https://oauth2.googleapis.com/token"
# jwks_uri = "https://www.googleapis.com/oauth2/v3/certs"
# client_id = "REPLACE_WITH_V2_CLIENT_ID"
# client_secret_file = "/path/to/private/client-secret"
# public_origin = "https://montara-v2.example.invalid"

# H2.8 restricted engineering pilot; requires OIDC and all private storage roots.
# [pilot]
# allowed_subjects = ["REPLACE_WITH_VERIFIED_SUBJECT"]
# renderer_root = "/path/to/pinned-renderer"
# engine_root = "/path/to/pinned-engine"
# render_timeout_sec = 180

# Optional H2.10 synthetic fixture bank; enable only inside [pilot].
# fixture_bank_root = "/path/to/immutable-fixture-bank-v1"
