[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "montara-core"
version = "0.1.0"
description = "Montara Core V2 — H1.1 executable skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
oidc = ["PyJWT[crypto]==2.15.1"]

[tool.setuptools.packages.find]
where = ["src"]
